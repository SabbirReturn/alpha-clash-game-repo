<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet Clash</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <header>

    </header>
    <main class="relative min-h-screen overflow-hidden
         bg-[#090914]
         bg-[url(images/background.png)]
         bg-no-repeat bg-center bg-cover">
        <!-- home screen -->
        <section id="home-screen" class="min-h-screen  flex  justify-center items-center">
            <div class="text-white flex flex-col  items-center gap-10">
                <h1 class="text-8xl poppins-extrabold">ALPHABET CLASH</h1>
                <p class="text-2xl">Unleash Your Keyboard Kung Fu : Press “Enter” to Play</p>
                <button onclick="playNow()" class="btn btn-lg border-0 rounded-full px-10
                bg-gradient-to-r from-purple-600 to-indigo-600
                 text-white text-lg font-bold
                shadow-[0_0_25px_rgba(139,92,246,0.45)]
                hover:scale-105 hover:shadow-[0_0_35px_rgba(139,92,246,0.7)]
                transition duration-300">
             Play Now
                <span class="text-xl">➜</span>
            </button>
            <p class="text-xs sm:text-sm text-gray-500">
                READY · FOCUS · TYPE · WIN
            </p>
            </div>
        </section>

        <!--Play Ground -->
        <section id="playGround" class="hidden">
            <!-- play Ground Start -->
             <div class="min-h-screen flex flex-col  justify-center items-center gap-10">
                <!-- screen -->
                <div>
                    <div class="w-[280px] sm:w-[340px] md:w-[420px]
                        h-[280px] sm:h-[320px] md:h-[350px]
                        rounded-3xl border border-white/20
                         bg-white/10 backdrop-blur-xl
                        shadow-[0_0_40px_rgba(139,92,246,0.18)]
                        flex flex-col overflow-hidden text-white">
                        <div class="flex justify-center">
                            <p class="bg-[#2F2941] text-[#FFFFFF] poppins-medium px-8 rounded-b-xl">Don't watch keyboard  while playing...</p>
                        </div>
                        <div class="flex justify-center items-center h-full">
                            <p id="current-alphabet" class="text-7xl sm:text-8xl md:text-9xl font-extrabold uppercase text-white
                            drop-shadow-[0_0_25px_rgba(168,85,247,0.9)]">Y</p>
                        </div>
                    </div>
                </div>
                 <!-- keyboard -->
                <div class="uppercase">
                    <div class="my-1 flex w-full justify-center gap-1 ">
                        <kbd id="q" class="kbd">q</kbd>
                        <kbd id="w" class="kbd">w</kbd>
                        <kbd id="e" class="kbd">e</kbd>
                        <kbd id="r" class="kbd">r</kbd>
                        <kbd id="t" class="kbd">t</kbd>
                        <kbd id="y" class="kbd">y</kbd>
                        <kbd id="u" class="kbd">u</kbd>
                        <kbd id="i" class="kbd">i</kbd>
                        <kbd id="o" class="kbd">o</kbd>
                        <kbd id="p" class="kbd">p</kbd>
                    </div>
                    <div class="my-1 flex w-full justify-center gap-1">
                        <kbd id="a" class="kbd">a</kbd>
                        <kbd id="s" class="kbd">s</kbd>
                        <kbd id="d" class="kbd">d</kbd>
                        <kbd id="f" class="kbd">f</kbd>
                        <kbd id="g" class="kbd">g</kbd>
                        <kbd id="h" class="kbd">h</kbd>
                        <kbd id="j" class="kbd">j</kbd>
                        <kbd id="k" class="kbd">k</kbd>
                        <kbd id="l" class="kbd">l</kbd>
                    </div>
                    <div class="my-1 flex w-full justify-center gap-1">
                        <kbd id="z" class="kbd">z</kbd>
                        <kbd id="x" class="kbd">x</kbd>
                        <kbd id="c" class="kbd">c</kbd>
                        <kbd id="v" class="kbd">v</kbd>
                        <kbd id="b" class="kbd">b</kbd>
                        <kbd id="n" class="kbd">n</kbd>
                        <kbd id="m" class="kbd">m</kbd>
                        <kbd id="/" class="kbd">/</kbd>
                    </div>
                </div>
                <!-- result and life -->
                <div class="flex justify-between items-center
                        gap-4 w-full max-w-md mx-auto px-4">
                    <button class="btn bg-[#894189] text-[#FFFFFF] rounded-full">
                        Life
                        <img src="icons/Vector.png" alt="">
                        <span id="life">5</span>
                    </button>
                    <button class="btn bg-[#894189] text-[#FFFFFF] rounded-full">
                        Score
                        <img src="icons/monetization_on.png" alt="">
                        <span id="score">0</span>
                    </button>
                </div>
             </div>
        </section>

        <!-- score board -->
         <section id="scoreBoard" class="scoreBoard flex justify-center items-center min-h-screen hidden">
            <div class="text-center space-y-5 bg-[#FFFFFF33] p-5 rounded-lg">
                <h1 class="text-8xl text-[#FFFFFF]">
                    <span>Score:</span>
                    <span id="last-score">14</span>
                </h1>
                <button onclick="playNow()" class="btn btn-xs sm:btn-sm md:btn-md lg:btn-lg bg-[#FFFFFF] text-[#010313] poppins-semibold ">Play again</button>
                <p class="text-[#FFFFFF]">Practice will make you Pro</p>
            </div>
         </section>
    </main>
    <script src="scripts/utility.js"></script>
    <script src="scripts/index.js"></script>
</body>
</html>
